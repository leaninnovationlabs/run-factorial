[project]
name = "factorial-runtime"
version = "0.1.0"
description = "Agent-runtime wrapper — vendor-neutral contract plus adapters"
license = "FSL-1.1-ALv2"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk==0.2.174",
    "e2b>=2.51,<3",
    # The assistant's Bedrock backend streams from it (tech-stack decision 63); e2b already
    # brings it, and it is declared because it is used directly (decision 14).
    "httpx>=0.28",
    "pydantic>=2.10",
]

[project.scripts]
factorial-assistant-cli = "runtime.assistant.adapters.claude_sdk.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime"]
