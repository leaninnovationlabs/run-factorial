# Agent manifest. The process's Runtime picks the CLI and supplies its key, so `model:` must be
# a model that CLI accepts.
specVersion: factorial/v1
kind: Agent
name: __AGENT_NAME__
description: Turns a raw request or ticket into a reviewable contract (a spec, a plan and a task list)

prompts:
  system: system-prompt.md # role + output contract
  instructions: instructions.md # operational context (workspace, delivery, revision)

skills:
  local: # from this agent's skills/ directory
    - speckit-specify
    - speckit-clarify
    - speckit-tasks
  shared: # from the .factorial-level skills/ directory
    - project-constitution
    - spec-page # the summary page, when the step's preview declares one

# MCP servers this agent may call, by name: `.factorial/mcp/<name>.yaml` for shared, this agent's
# `mcp/<name>.yaml` for local. Naming one here selects it; the project's operator allowlist is what
# permits it to run. Secrets the server needs are declared in the server file, not
# here. The orchestrator resolves both lists at spawn.
#
# An example, and off: a server needs a real endpoint, its secret stored, and an allowlist entry.
# To use `.factorial/mcp/product-docs.yaml.example`, rename it to `product-docs.yaml` and point it
# at a real server, permit it in the project's MCP allowlist, then uncomment these lines.
# mcp:
#   shared:
#     - product-docs

# Concrete model id, never a size alias: an alias resolves to a name the API rejects,
# and the agent fails on its first turn. A Codex runtime needs a Codex model id.
model: claude-opus-5-5

limits:
  # A turn is one model request on Claude, one prompt round on Codex; the run fails past the limit.
  # The count spans resumes within one attempt and restarts on a retry.
  # 200 fits a real ticket, under where a 1-hour step ends an Opus run; a Sonnet run ends later.
  max_turns: 200

# What must be minted for this agent. This is NOT an isolation boundary: the substrate may
# inject every stored secret into every container regardless of what is
# declared here. Values are never stored in this folder; they come from the orchestrator's
# project secrets at spawn time, except the vendor key, which the process's Runtime supplies.
secrets:
  - key: GH_TOKEN
    description: The forge's token for the target repo, minted per run (on GitLab, a project token)
