# The Primary lane: plan, spec review, build, code review, done.
#
# Started from the factorial editor's Simple template. https://www.runfactorial.com/docs/processes/
# describes every field, and https://www.runfactorial.com/docs/previews/ the previews below.
#
# `name:` names the lane, and must match the file: `processes/process-<name>.yaml`. An issue
# enters the lane by carrying `factorial:process:<name>`, or no process label at all while the
# project's default process is this lane. `entry.when` decides readiness only, never the lane.
#
# A step moves to its `next` once its postconditions hold on GitHub or GitLab. The orchestrator
# checks them itself and never trusts an agent's own report. A ticket keeps the commit it was
# admitted under until it is done, so an edit here reaches new tickets only.
#
# Templates: {ticket} is the issue number, {repo} the repository, {ticket_owner} the assignee at
# admission, {pr_url} the step's pull request (on GitLab, its merge request). {slug} is the part
# of a branch name the agent chooses, so predicates match it with `*`.
#
# `assign:` REPLACES the issue's assignees, so the ticket always sits with whoever acts next.
# A gate advances on one qualifying approval: a person in `approvers`, or anyone with the
# `approverPermission` role or a stronger one on the repository.
#
# What needs something set up outside this repository is left commented out as an example: a
# Runtime below, the app preview on the build step, and the MCP server named in
# agents/plan-agent/agent.yaml. One check is off the same way: a person's approval in the
# dashboard on the plan step.

specVersion: factorial/v1
kind: Process
name: primary

# What this process expects of the REPOSITORY, as opposed to how its steps run (that is
# `defaults`). required | advisory | ignored, default advisory. It changes what the configuration
# page reports about the default branch's protection and nothing else: none of the three gate
# activation, admission, or a merge, because this file lives in the repo agents write to and
# enforcement an agent can switch off reads as a control while being a preference. Write
# `ignored`, never `off`: YAML reads a bare `off` as the boolean false.
policy:
  branchProtection: advisory
# Name the Runtime the agents run on: its type says which CLI runs them, and it supplies the
# vendor key. A slug names a Runtime from the dashboard's Runtimes page, which sync requires to
# exist. The editor's Runtime select writes the line under this example.
# runtime: claude-api
description: Plan, spec review, build, code review, done

roles:
  spec_reviewers: ["{ticket_owner}"]
  code_reviewers: ["{ticket_owner}"] # single-reviewer sample; point at a real team later

defaults:
  timeout: 1h # counts the time the session works, not the time it waits at its prompt
  retry:
    maxAttempts: 2
    backoff: 10m
  onFailure:
    escalate:
      ticketLabel: "factorial:blocked"
      assign: ["{ticket_owner}"]
      comment: |
        Factorial stopped at {step} after {attempt} attempt(s): {failure_summary}.
        Fix the cause, then remove `factorial:blocked` to retry.

entry:
  when:
    all:
      - ticket_label("factorial:new")
      - ticket_has_assignee()
  step: plan

steps:
  # ------------------------------------------------------------------- 1. plan (agent)
  - name: plan
    kind: agent
    description: Turn the ticket into a reviewable contract (spec, plan, tasks)
    agent: plan-agent
    next: spec_review_gate
    workspace:
      repo: "{repo}"
      base: main
      branch: "spec/{ticket}-{slug}" # {slug} is chosen by the agent at runtime
    preconditions:
      all:
        - ticket_has_assignee()
    inputs:
      - ticket_body
      - ticket_comments
    # Fires once per attempt, when the spawn happens. {step} and {attempt} are available.
    onStart:
      comment: "Plan agent starting (attempt {attempt}). It turns the ticket into a reviewable contract."
    postconditions:
      all:
        - branch_exists("spec/{ticket}-*")
        - file_exists("specs/{ticket}-*/spec.md", "spec/{ticket}-*")
        - pr_open("spec/{ticket}-*", "main")
        # Optional, and off here. Uncomment to make the run also wait for a person to press
        # Approve in the dashboard, at the commit the spec ends on, before the gate below opens.
        # - request_approval()
    onSuccess:
      ticketLabel: "factorial:spec-review"
      assign: ["{roles.spec_reviewers}"]
      comment: "Spec ready for review: {pr_url}"
    # The files shown beside each run, each in its own tab: the summary page this agent writes
    # for the reviewer (its `spec-page` skill), then the three spec files. Each is read from the
    # step's own branch, so it merges with the spec. A path ending in `.html` is served as a page,
    # `.md` as rendered Markdown, anything else as plain text, all with scripts and network off.
    # A path with `*` (one folder) or `**` (any folders) is a pattern, which shows each file it
    # matches in its own tab and must have a label: `{ path: "reports/{ticket}/*.html", label:
    # "Reports" }`. Display only: a file the agent did not write shows as missing. See
    # https://www.runfactorial.com/docs/previews/.
    preview:
      files:
        - { path: "specs/{ticket}-{slug}/summary.html", label: "Summary" }
        - { path: "specs/{ticket}-{slug}/spec.md", label: "Spec" }
        - { path: "specs/{ticket}-{slug}/plan.md", label: "Plan" }
        - { path: "specs/{ticket}-{slug}/tasks.md", label: "Tasks" }

  # ------------------------------------------------------------- 2. spec review (human)
  - name: spec_review_gate
    kind: human_gate
    description: Reviewer approves the spec pull request
    next: build
    gate:
      type: pr_approval
      pr: { head: "spec/{ticket}-*", base: "main" }
      approvers: ["{roles.spec_reviewers}"]
      approverPermission: write
      waiting:
        ticketLabel: "factorial:spec-review"
        # REPLACES the assignees: the gate parks the ticket with its own approvers.
        assign: ["{roles.spec_reviewers}"]
      onApprove:
        merge: true
        ticketLabel: "factorial:ready-for-build"
        assign: ["{ticket_owner}"]
      onReject:
        rerunStep: plan
        inputs:
          - pr_review_comments
        ticketLabel: "factorial:spec-rework"
        assign: ["{ticket_owner}"]
      onConflict:
        rerunStep: plan

  # ------------------------------------------------------------------ 3. build (agent)
  - name: build
    kind: agent
    description: Implement the approved spec
    agent: build-agent
    next: code_review_gate
    workspace:
      repo: "{repo}"
      base: main # the spec merged at spec_review_gate, so the build starts from main
      branch: "impl/{ticket}-{slug}"
    preconditions:
      all:
        # Observe another step's finished work. Never guard a step against its own earlier
        # attempts (`not: branch_exists(...)`): a rework could then never start.
        - pr_merged("spec/{ticket}-*", "main")
    inputs:
      - ticket_body
      - file: "specs/{ticket}-*/spec.md"
      - file: "specs/{ticket}-*/tasks.md"
    onStart:
      comment: "Build agent starting (attempt {attempt}). It implements the approved spec."
    postconditions:
      all:
        - branch_exists("impl/{ticket}-*")
        - pr_open("impl/{ticket}-*", "main")
    onSuccess:
      ticketLabel: "factorial:code-review"
      assign: ["{roles.code_reviewers}"]
      comment: "Implementation ready for review: {pr_url}"
    # Optional, and off here. An app preview: the run's own cloud sandbox serves the app when a
    # reviewer presses Start preview, so the process must name a cloud sandbox runtime. Add the
    # install hosts to the project's egress permits first, bind the server to 0.0.0.0, and adapt
    # the commands to this repository.
    # preview:
    #   setup: ["npm ci"]
    #   services:
    #     - name: web
    #       command: "npm run dev -- --host 0.0.0.0 --port $PORT"
    #       port: 3000
    #       ready: { path: "/", timeout: 120s }
    #   stopAfter: 30m

  # ------------------------------------------------------------- 4. code review (human)
  - name: code_review_gate
    kind: human_gate
    description: Reviewer approves the implementation pull request
    next: done
    gate:
      type: pr_approval
      pr: { head: "impl/{ticket}-*", base: "main" }
      approvers: ["{roles.code_reviewers}"]
      approverPermission: write
      waiting:
        ticketLabel: "factorial:code-review"
        assign: ["{roles.code_reviewers}"]
      onApprove:
        merge: true
        ticketLabel: "factorial:done"
        assign: ["{ticket_owner}"]
      onReject:
        rerunStep: build
        inputs:
          - pr_review_comments
        ticketLabel: "factorial:build-rework"
        assign: ["{ticket_owner}"]
      onConflict:
        rerunStep: build

terminal:
  step: done
  actions:
    closeTicket: true
    comment: "Factorial finished. Merged to main."
