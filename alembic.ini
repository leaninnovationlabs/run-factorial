; Alembic config — run from the repo root: `uv run alembic upgrade head` (tech-stack.md §4).
;
; There is deliberately no `sqlalchemy.url` here: the database URL is deployment wiring and
; lives in `orchestrator.settings` (FACTORIAL_DATABASE_URL), so the ini can never disagree with the
; running application. Override for a one-off with `-x db_url=postgresql+asyncpg://...`.

[alembic]
script_location = orchestrator/migrations
prepend_sys_path = orchestrator/src
path_separator = os

# Sequential four-digit revision ids, set by hand with --rev-id; the slug keeps them greppable.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
