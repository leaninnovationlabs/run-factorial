# ADLC process: the factorial-simple sample. This file is the reference for the format.
# Plan, spec review, build, test, code review, done. GitHub or GitLab: read a pull request below as a merge request on GitLab.
#
# One process per file, at `.factorial/processes/process-<name>.yaml` on the repo's `factorial`
# branch, which sync reads by default. The stem minus its `process-` prefix IS the process name
# and must equal the `name:` below. A project may hold as many lanes as it likes. There is no
# `version:`. A snapshot is identified by the commit it was synced from, so the process builder's
# "Commit and sync" is all there is to it. An issue enters this one by carrying
# `factorial:process:simple`, or by carrying no process label at all when the project's
# `default_process` setting names it. `entry.when` below decides READINESS only, never which lane
# an issue belongs to.
#
# The state machine is driven by each step's `next` pointer, once that step's postconditions
# hold. A ticket pins the commit it was admitted under and keeps it until done. Conditions are
# compositions of the orchestrator's predicate library (docs/process-yaml.md), never prose.
#
# Templates: {ticket} = issue number, {repo} = target repo, {pr_url} = the step's pull request (for
# a step that opens none, the pull request its workspace.branch glob matches instead, as in the test
# step), {ticket_owner} = assignee at admission (recorded in the orchestrator state DB, stable
# even after reassignment). Branch names and paths follow what the agents produce: the agent
# chooses a short slug at runtime, so templates use {slug} and predicates match with a `*` glob
# (branch, PR-head and file-path arguments all accept `*`). Once the orchestrator observes the
# delivered branch or pull request, {slug} resolves to that concrete name. Unresolved is still the
# fallback, and resolution is not permanent: a later tick reverts to unresolved if a further
# artifact makes the observed name ambiguous. A rerun landing on a different slug is not
# ambiguity, because under one branch template the newest attempt supersedes the one it
# replaced. Resolution only ever feeds template DIRECTIVES (workspace.branch, predicate
# arguments). The orchestrator's own pull request and gate lookups against observed state stay
# `*`-globbed regardless, on purpose.
#
# Assignment: every outcome block (onStart, onSuccess, onFailure.escalate, gate.onApprove,
# gate.onReject, gate.waiting, terminal.actions) accepts an optional `assign: [...]` that
# REPLACES the issue assignees when that outcome fires, so the ticket always sits with whoever
# must act next. Entries are usernames, templates ({ticket_owner}) or roles defined below.
#
# Human gates: ALL gate controls live under the step's `gate:` attribute. That covers what is
# gated (type, pr, approvers, approverPermission) and what happens (waiting, onApprove, onReject).
# `approverPermission: write` (or maintain, admin) also lets anyone with that repository role
# decide the gate; without it only `approvers` decide, and an empty list means any person.
#
# Previews: any step except a gate may carry `preview:`, which shows beside each of its runs on
# the ticket page and never blocks the step. `files:` names files an agent step writes on its own
# branch, each in its own tab, which the API serves with scripts and network off (see the plan
# step). A URL shows too (see the build step): with `services`, the run's own cloud sandbox serves
# it on request; without, a producer publishes it.
#
# A third step kind, `kind: action`, dispatches to a registered action (an `action:` name,
# never an agent or a container) rather than a substrate. A fourth, `kind: check`, completes
# when its `conditions` hold on observed state (no agent, no action and no person;
# it is built for waiting on CI). See docs/process-yaml.md. This sample uses neither: its
# `test` step runs the suite itself.
#
# Runtime: `runtime: <slug>` selects the Runtime (a row on the Runtimes page) the agents run on.
# Sync refuses a slug the page lacks. The agents declare no `runtime.kind`: the Runtime's type
# says which CLI runs them, and sync refuses the process without it. `claude-api` is the fleet's
# Claude runtime; it alone supplies the vendor key, so the agents do not declare it.

specVersion: factorial/v1
kind: Process
name: simple

# What this process expects of the REPOSITORY, as opposed to how its steps run (that is
# `defaults`). required | advisory | ignored, default advisory. It changes what the configuration
# page reports about the default branch's protection and nothing else: none of the three gate
# activation, admission, or a merge, because this file lives in the repo agents write to and
# enforcement an agent can switch off reads as a control while being a preference. Write
# `ignored`, never `off`: YAML reads a bare `off` as the boolean false.
policy:
  branchProtection: advisory
runtime: claude-api
description: Plan, spec review, build, test, code review, done

roles:
  spec_reviewers: ["{ticket_owner}"]
  code_reviewers: ["{ticket_owner}"] # single-reviewer sample; point at a real team later

defaults:
  timeout: 1h # counts the time the session works, not the time it waits at its prompt
  retry:
    maxAttempts: 2
    backoff: 10m
  onFailure:
    escalate:
      ticketLabel: "factorial:blocked"
      assign: ["{ticket_owner}"]
      comment: |
        Factorial stopped at {step} after {attempt} attempt(s): {failure_summary}.
        Fix the cause, then remove `factorial:blocked` to retry.

entry:
  when:
    all:
      - ticket_label("factorial:new")
      - ticket_has_assignee()
  step: plan

steps:
  # ------------------------------------------------------------------- 1. plan (agent)
  - name: plan
    kind: agent
    description: Turn the ticket into a reviewable contract (spec, plan, tasks)
    agent: plan-agent
    next: spec_review_gate
    workspace:
      repo: "{repo}"
      base: main
      branch: "spec/{ticket}-{slug}" # {slug} is chosen by the agent at runtime
    preconditions:
      all:
        - ticket_has_assignee()
    inputs:
      - ticket_body
      - ticket_comments
    # Fires once per attempt, when the spawn happens. {step} and {attempt} are available.
    onStart:
      comment: "Plan agent starting (attempt {attempt}). It turns the ticket into a reviewable contract."
    postconditions:
      all:
        - branch_exists("spec/{ticket}-*")
        - file_exists("specs/{ticket}-*/spec.md", "spec/{ticket}-*")
        - pr_open("spec/{ticket}-*", "main")
        # Optional, and off here. Uncomment to make the run also wait for a person to press
        # Approve in the dashboard, at the commit the spec ends on, before the gate below opens.
        # - request_approval()
    onSuccess:
      ticketLabel: "factorial:spec-review"
      assign: ["{roles.spec_reviewers}"]
      comment: "Spec ready for review: {pr_url}"
    # The files shown beside each run, each in its own tab: the summary page this agent writes
    # for the reviewer (its `spec-page` skill), then the three spec files. Each is read from the
    # step's own branch, so it merges with the spec. A path ending in `.html` is served as a page,
    # `.md` as rendered Markdown, anything else as plain text, all with scripts and network off.
    # A path with `*` (one folder) or `**` (any folders) is a pattern, which shows each file it
    # matches in its own tab and must have a label: `{ path: "reports/{ticket}/*.html", label:
    # "Reports" }`. Display only: a file the agent did not write shows as missing. See
    # docs/enable-previews.md.
    preview:
      files:
        - { path: "specs/{ticket}-{slug}/summary.html", label: "Summary" }
        - { path: "specs/{ticket}-{slug}/spec.md", label: "Spec" }
        - { path: "specs/{ticket}-{slug}/plan.md", label: "Plan" }
        - { path: "specs/{ticket}-{slug}/tasks.md", label: "Tasks" }

  # ------------------------------------------------------------- 2. spec review (human)
  - name: spec_review_gate
    kind: human_gate
    description: Reviewer approves the spec pull request
    next: build
    gate:
      type: pr_approval
      pr: { head: "spec/{ticket}-*", base: "main" }
      approvers: ["{roles.spec_reviewers}"]
      approverPermission: write
      waiting:
        ticketLabel: "factorial:spec-review"
        # REPLACES the assignees: the gate parks the ticket with its own approvers.
        assign: ["{roles.spec_reviewers}"]
      onApprove:
        merge: true
        ticketLabel: "factorial:ready-for-build"
        assign: ["{ticket_owner}"]
      onReject:
        rerunStep: plan
        inputs:
          - pr_review_comments
        ticketLabel: "factorial:spec-rework"
        assign: ["{ticket_owner}"]
      # The agent step that fixes a pull request that conflicts with its target.
      onConflict:
        rerunStep: plan

  # ------------------------------------------------------------------ 3. build (agent)
  - name: build
    kind: agent
    description: Implement the approved spec
    agent: build-agent
    next: test
    workspace:
      repo: "{repo}"
      base: main # the spec merged at spec_review_gate, so the build starts from main
      branch: "impl/{ticket}-{slug}"
    preconditions:
      all:
        # Observe another step's finished work. Never guard a step against its own earlier
        # attempts (`not: branch_exists(...)`): a rework could then never start.
        - pr_merged("spec/{ticket}-*", "main")
    inputs:
      - ticket_body
      - file: "specs/{ticket}-*/spec.md"
      - file: "specs/{ticket}-*/tasks.md"
    onStart:
      comment: "Build agent starting (attempt {attempt}). It implements the approved spec."
    postconditions:
      all:
        - branch_exists("impl/{ticket}-*")
        - pr_open("impl/{ticket}-*", "main")
    onSuccess:
      ticketLabel: "factorial:testing"
      comment: "Implementation ready for testing: {pr_url}"
    # Optional, and off here. `preview:` shows each run's output beside its terminal.
    # `services` has the run's own cloud sandbox serve it when a reviewer presses Start, so the
    # process must name a cloud sandbox runtime; without `services`, a producer publishes the URL
    # with `PUT /api/step-runs/{id}/preview`. Bind the server to 0.0.0.0 and adapt the commands to
    # the repo; see docs/enable-previews.md.
    # preview:
    #   setup: ["npm ci"]
    #   services:
    #     - name: web
    #       command: "npm run dev -- --host 0.0.0.0 --port $PORT"
    #       port: 3000
    #       ready: { path: "/", timeout: 120s }
    #   stopAfter: 30m

  # ------------------------------------------------------------------- 4. test (agent)
  - name: test
    kind: agent
    description: Run the test suite against the implementation pull request and post a pass/fail verdict
    agent: test-agent
    next: code_review_gate
    workspace:
      repo: "{repo}"
      # The agent finds the implementation pull request itself. `branch` still matters: {pr_url}
      # resolves against it, so it names the build step's branch although this step pushes none.
      base: main
      branch: "impl/{ticket}-{slug}"
    preconditions:
      all:
        - pr_open("impl/{ticket}-*", "main")
    onStart:
      comment: "Test agent starting (attempt {attempt}). It runs the suite against the implementation."
    postconditions:
      all:
        # The verdict comment is the acceptance gate: proof the test agent ran. Its PASS or FAIL
        # text is not checked.
        - pr_comment_contains("impl/{ticket}-*", "## Test Verdict")
    onSuccess:
      ticketLabel: "factorial:code-review"
      assign: ["{roles.code_reviewers}"]
      comment: "Implementation ready for review: {pr_url}"

  # ------------------------------------------------------------- 5. code review (human)
  - name: code_review_gate
    kind: human_gate
    description: Reviewer approves the implementation pull request
    next: done
    gate:
      type: pr_approval
      pr: { head: "impl/{ticket}-*", base: "main" }
      approvers: ["{roles.code_reviewers}"]
      approverPermission: write
      waiting:
        ticketLabel: "factorial:code-review"
        assign: ["{roles.code_reviewers}"]
      onApprove:
        merge: true
        ticketLabel: "factorial:done"
        assign: ["{ticket_owner}"]
      onReject:
        rerunStep: build
        inputs:
          - pr_review_comments
        ticketLabel: "factorial:build-rework"
        assign: ["{ticket_owner}"]
      # The agent step that fixes a pull request that conflicts with its target.
      onConflict:
        rerunStep: build

terminal:
  step: done
  actions:
    closeTicket: true
    comment: "Factorial finished. Merged to main."
