# Agent manifest. The process's Runtime picks the CLI and supplies its key, so `model:` must be
# a model that CLI accepts.
specVersion: factorial/v1
kind: Agent
name: test-agent
description: Runs the repo's test suite against the implementation merge request and posts a pass/fail verdict

prompts:
  system: system-prompt.md
  instructions: instructions.md

skills:
  shared:
    - project-constitution

# Concrete model id, never a size alias: an alias resolves to a name the API rejects,
# and the agent fails on its first turn. A Codex runtime needs a Codex model id.
model: claude-sonnet-5-5

limits:
  # A turn is one model request on Claude, one prompt round on Codex; the run fails past the limit.
  # The count spans resumes within one attempt and restarts on a retry.
  # 200 fits a real ticket, under where a 1-hour step ends an Opus run; a Sonnet run ends later.
  max_turns: 200

# What must be minted for this agent. This is NOT an isolation boundary: the substrate may
# inject every stored secret into every container regardless of what is
# declared here. Values are never stored in this folder; they come from the orchestrator's
# project secrets at spawn time, except the vendor key, which the process's Runtime supplies.
secrets:
  - key: GH_TOKEN
    description: GitLab project token, minted per run and presented as GH_TOKEN
