name: lint

# ruff check and pyright over the whole repo.
# Each push to main runs it, that is, each sync from the private repository.
"on":
  push: { branches: ["main"] }

permissions:
  contents: read

jobs:
  lint:
    name: ruff + pyright
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false


      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.5"
          enable-cache: true

      - run: uv sync

      - run: uv run ruff check .

      # githubkit's generated models push pyright past Node's default ~2 GB heap on a hosted
      # runner; a laptop's larger default hides it.
      - run: uv run pyright
        env:
          NODE_OPTIONS: --max-old-space-size=4096

